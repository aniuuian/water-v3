    <rect x="118" y="148" width="240" height="74" rx="20" fill="#0f8a59" opacity=".95"/>
    <text x="150" y="196" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Water Solution</text>
    <text x="118" y="262" font-family="Arial, sans-serif" font-size="25" fill="#517060">Flexible leasing for home and office purification</text>

    <rect x="118" y="334" width="500" height="312" rx="28" fill="#f7fbf8" stroke="#d6ebe1"/>
    <path d="M155 530 C 250 460, 350 460, 458 520 S 610 580, 660 470" fill="none" stroke="url(#stream)" stroke-width="14" stroke-linecap="round"/>
    <path d="M162 560 C 250 510, 356 500, 460 548 S 612 610, 672 526" fill="none" stroke="url(#stream)" stroke-width="8" stroke-linecap="round" opacity=".8"/>
    <circle cx="225" cy="450" r="18" fill="#86dcb5"/>
    <circle cx="392" cy="430" r="22" fill="#3cb57d"/>
    <circle cx="548" cy="492" r="16" fill="#8ee0c0"/>
    <text x="156" y="386" font-family="Arial, sans-serif" font-size="22" fill="#5d766c">Stable filtration</text>
    <text x="156" y="418" font-family="Arial, sans-serif" font-size="22" fill="#5d766c">Monthly leasing</text>
    <text x="156" y="450" font-family="Arial, sans-serif" font-size="22" fill="#5d766c">Maintenance included</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="742" y="268" width="290" height="482" rx="34" fill="#ffffff"/>
    <image href="../products/Bio Pure N100.png" x="770" y="302" width="120" height="120" preserveAspectRatio="xMidYMid meet"/>
    <image href="../products/Bio Pure N200.png" x="874" y="334" width="136" height="136" preserveAspectRatio="xMidYMid meet"/>
    <image href="../products/Hydromi NH101.png" x="792" y="458" width="140" height="140" preserveAspectRatio="xMidYMid meet"/>
    <image href="../products/Hydromi NH500.png" x="912" y="508" width="92" height="92" preserveAspectRatio="xMidYMid meet"/>
    <rect x="776" y="614" width="220" height="94" rx="18" fill="#ecf8f1"/>
    <text x="800" y="650" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f8a59">Original devices</text>
    <text x="800" y="682" font-family="Arial, sans-serif" font-size="18" fill="#5d766c">Kept from the current product set</text>
  </g>

  <g>
    <rect x="1060" y="186" width="286" height="158" rx="28" fill="#ffffff" filter="url(#shadow)"/>
    <text x="1092" y="236" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f8a59">Low upfront cost</text>
    <text x="1092" y="274" font-family="Arial, sans-serif" font-size="20" fill="#5d766c">A practical leasing path for flexible budgets.</text>
    <rect x="1060" y="372" width="286" height="158" rx="28" fill="#ffffff" filter="url(#shadow)"/>
    <text x="1092" y="422" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f8a59">Installation support</text>
    <text x="1092" y="460" font-family="Arial, sans-serif" font-size="20" fill="#5d766c">Setup and maintenance stay part of the plan.</text>
    <rect x="1060" y="558" width="286" height="158" rx="28" fill="#ffffff" filter="url(#shadow)"/>
    <text x="1092" y="608" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f8a59">Flexible monthly plans</text>
    <text x="1092" y="646" font-family="Arial, sans-serif" font-size="20" fill="#5d766c">Designed to keep access simple and predictable.</text>
  </g>
