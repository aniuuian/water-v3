<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-label="Water solution layout">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fbf7"/>
      <stop offset="55%" stop-color="#e5f5ee"/>
      <stop offset="100%" stop-color="#d8efe4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef7f2"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fe0c1" stop-opacity="0"/>
      <stop offset="15%" stop-color="#8fe0c1" stop-opacity=".85"/>
      <stop offset="85%" stop-color="#37b57e" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#37b57e" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0c5a3b" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1440" height="920" fill="url(#bg)"/>
  <circle cx="1140" cy="140" r="150" fill="#ffffff" opacity=".45"/>
  <circle cx="1240" cy="220" r="210" fill="#ffffff" opacity=".28"/>
  <circle cx="280" cy="760" r="180" fill="#ffffff" opacity=".35"/>
  <path d="M0 660 C 220 580, 420 720, 650 650 S 1120 590, 1440 690 L 1440 920 L 0 920 Z" fill="#ccebdc" opacity=".7"/>
  <path d="M0 700 C 260 620, 440 780, 690 708 S 1130 640, 1440 738" fill="none" stroke="#8ae0b9" stroke-width="5" opacity=".45"/>
  <path d="M0 748 C 230 680, 470 816, 720 760 S 1160 692, 1440 790" fill="none" stroke="#4fca97" stroke-width="4" opacity=".35"/>

  <g filter="url(#shadow)">
